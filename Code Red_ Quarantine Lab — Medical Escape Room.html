<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Code Red: Quarantine Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--fg:#d8e4e8;--ac:#35e0c0;--rd:#ff3b3b;--pn:#0c1316;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a0a0a,#000);z-index:30;text-align:center}
.box{background:var(--pn);border:1px solid #35e0c066;border-radius:10px;padding:20px 26px;max-width:min(620px,92vw);max-height:86vh;overflow:auto;box-shadow:0 0 40px #000}
#m{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20}
button,input{font:inherit;background:#12242a;color:var(--fg);border:1px solid var(--ac);border-radius:6px;padding:6px 12px;margin:3px;cursor:pointer}
input{cursor:text}h1{color:var(--rd);margin:.2em 0}.sm{font-size:12px;opacity:.7}
#hud>*{position:fixed;z-index:10;pointer-events:none}#hud #hb{pointer-events:auto}
#tm{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 34px monospace;color:var(--rd);text-shadow:0 0 14px red;background:#000a;padding:2px 18px;border-radius:8px}
#st{top:calc(8px + env(safe-area-inset-top,0px));left:12px;background:#000a;padding:4px 10px;border-radius:8px;font-size:13px}
#hb{top:calc(8px + env(safe-area-inset-top,0px));right:12px}
#cx{top:50%;left:50%;transform:translate(-50%,-50%);color:#fff9}
#pr{top:56%;left:50%;transform:translateX(-50%);color:var(--ac);text-shadow:0 0 6px #000}
#inv{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;background:#000a;padding:4px 10px;border-radius:8px;font-size:13px}
#ts{bottom:70px;left:50%;transform:translateX(-50%);background:#000c;padding:4px 14px;border-radius:8px}
#vg{inset:0;pointer-events:none;box-shadow:inset 0 0 170px #8008;animation:p 3s infinite}@keyframes p{50%{opacity:.35}}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #35e0c044;padding:4px 8px;text-align:left}.hi{color:var(--rd);font-weight:700}
</style></head><body>
<div id="hud" style="display:none"><div id="vg"></div><div id="tm">60:00</div><div id="st"></div><button id="hb" onclick="hint()">💡 HINT −3:00</button><div id="cx">+</div><div id="pr"></div><div id="inv"></div><div id="ts"></div></div>
<div id="m"></div>
<div id="start" class="scr"><div class="box"><h1>☣ CODE RED: QUARANTINE LAB</h1><p>The lab is sealed. Four sectors. One exit. You have 60 minutes.</p><input id="club" placeholder="Club name" maxlength="30"><br><button onclick="go()">START ▶</button><p class="sm">WASD move · Shift run · Mouse look (or arrow keys) · E / Click interact · F flashlight · Esc free cursor</p></div></div>
<div id="end" class="scr" style="display:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const sc=new THREE.Scene();sc.background=new THREE.Color(0x040506);sc.fog=new THREE.FogExp2(0x050505,.075);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,60);cam.rotation.order='YXZ';cam.position.set(0,1.6,3.5);sc.add(cam);
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);R.domElement.style.cssText='position:fixed;inset:0';
sc.add(new THREE.AmbientLight(0x3a4a55,.45));
const fl=new THREE.SpotLight(0xe8f8ff,2.4,22,.45,.5,1);cam.add(fl,fl.target);fl.target.position.z=-1;
let mode='start',T=3600,club='',hints=0,yaw=0,pit=0,inv=[],S={},open=[0,0,0,0],k={},lights=[],ia=[],sol=[],on=1,cur=null,AC,KP;
const WZ=[-5,-15,-25,-35],doors=[];
function B(w,h,d,x,y,z,c,n,f,o){o=o||{};const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),o.m||M(c));m.position.set(x,y,z);sc.add(m);if(n){m.userData={n,f};ia.push(m);if(w>.3)sol.push({m,b:[x-w/2,x+w/2,z-d/2,z+d/2]})}return m}
const GL=c=>M(0x001018,{emissive:c,emissiveIntensity:.9}),VI=c=>M(c,{transparent:true,opacity:.8,emissive:c,emissiveIntensity:.5});
// ---------- shell ----------
B(10,3.2,.3,0,1.6,5,0x26333a);
for(let i=0;i<4;i++){const z=-10*i,w=WZ[i];
 B(10,.2,10,0,-.1,z,0x141b1f);B(10,.2,10,0,3.1,z,0x0d1113);B(.3,3.2,10,-5,1.6,z,0x26333a);B(.3,3.2,10,5,1.6,z,0x26333a);
 B(4,3.2,.3,-3,1.6,w,0x2d3d45);B(4,3.2,.3,3,1.6,w,0x2d3d45);
 doors[i]=B(2,3,.2,0,1.5,w,0x5a1a1a,'Door '+(i+1),()=>door(i));
 B(.3,.4,.06,1.4,1.5,w+.18,0,0,0,{m:GL(0x00ff88)});
 const r=new THREE.PointLight(0xff1a1a,1.4,13);r.position.set(0,2.8,z);sc.add(r);lights.push(r);
 const c=new THREE.PointLight(0x8fd0ff,.5,9);c.position.set(0,2.8,z-2);sc.add(c);lights.push(c)}
// ---------- UI helpers ----------
const toast=t=>{$('#ts').textContent=t;clearTimeout(toast.h);toast.h=setTimeout(()=>$('#ts').textContent='',3800)};
const has=n=>inv.includes(n),add=n=>{inv.push(n);ui();beep(660,.1)},rem=n=>{inv=inv.filter(x=>x!=n);ui()};
const ui=()=>{$('#inv').innerHTML='🎒 '+(inv.join(' · ')||'empty');$('#st').innerHTML=`🏥 ${club}<br>Sector ${Math.min(open.filter(x=>x).length+1,4)}/4 · Hints used ${hints}`};
function modal(h){k={};$('#m').innerHTML='<div class=box>'+h+'<p><button onclick=closeM()>✕ Close (Esc)</button></p></div>';$('#m').style.display='flex';mode='ui';document.exitPointerLock()}
function closeM(){$('#m').style.display='none';if(mode=='ui')mode='play'}
function keypad(t,h,a,ok){KP={a,ok};modal(`<h3>🔒 ${t}</h3><p>${h}</p><input id=ki autocomplete=off maxlength=12 onkeydown="if(event.key=='Enter')kp()"><button onclick=kp()>ENTER</button><p id=kr></p>`);$('#ki').focus()}
function kp(){const v=$('#ki').value.trim().toUpperCase().replace(/MG$/,'');if(v==KP.a){closeM();KP.ok()}else{$('#kr').innerHTML='<span class=hi>ACCESS DENIED</span>';beep(150,.3,.08)}}
function door(i){if(open[i])return;
 if(i==0)keypad('MAIN LAB DOOR','Enter the 4-character code.','R731',()=>unlock(0));
 else if(i==1){if(has('Sector Key')){rem('Sector Key');unlock(1)}else toast('Locked. It needs the sector key from the safe.')}
 else if(i==2)keypad('SECURITY DOOR','Enter the 5-letter pathogen code.','STAPH',()=>unlock(2));
 else keypad('QUARANTINE EXIT','Enter the correct dose in mg (number only).','540',()=>{unlock(3);end(true)})}
function unlock(i){open[i]=1;doors[i].visible=false;ui();beep(990,.3,.07);toast('✔ Door unlocked')}
// ---------- Stage 1: Reception ----------
B(2.2,.8,1,-2.5,.4,-3,0x3b2f26);B(.7,.04,.45,-2.5,.82,-3,0x222222);B(.9,.6,2,-3.6,.3,2.5,0x8899a3);
B(.7,.45,.04,-2.5,1.07,-3.2,0,'Laptop',()=>modal(`<h3>🖥 RECEPTION LAPTOP</h3><b>📧 Inbox</b><p><u>Dr. Haddad:</u> "Main door code = the department letter on a staff badge + the last 3 digits of Nasser's MRN. Do not repeat this."</p><p><u>Facilities:</u> "Generator unstable, lights may flicker."</p><b>🗂 Patient logs</b><br><input id=q placeholder="Surname" onkeydown="if(event.key=='Enter')sq()"><button onclick=sq()>Search</button><div id=qr></div>`),{m:GL(0x1a9acb)});
function sq(){const v=$('#q').value.trim().toLowerCase(),P=[['Qahtani, Sara','MRN 20457 · Ward B'],['Nasser, Layla','MRN 58731 · Isolation'],['Salem, Omar','MRN 33190 · Staff']];$('#qr').innerHTML=v?(P.filter(p=>p[0].toLowerCase().includes(v)).map(p=>`<p>${p[0]} — ${p[1]}</p>`).join('')||'No match'):''}
B(1,1,.8,3.2,.5,-3,0x4a5560,'Desk drawers',()=>{if(S.b)return toast('Empty drawers.');S.b=1;add('ID Badge');modal('<h3>ID BADGE</h3><p>Dr. O. Salem · Dept <b class=hi>R</b> · Clearance 3</p>')});
// ---------- Stage 2: Hematology ----------
const z1=-10,vv=(c,n)=>{S[c]=1;S.v=(S.v||0)+1;add(n);toast(`${n} collected (${S.v}/3)`)};
B(2.4,.1,1,-2.5,.9,z1-1,0x6b7b82);B(.1,.85,1,-3.65,.43,z1-1,0x6b7b82);B(.1,.85,1,-1.35,.43,z1-1,0x6b7b82);
B(.14,.3,.14,-2.5,.15,z1-1,0,'Vial',m=>{m.visible=false;ia.splice(ia.indexOf(m),1);vv('a','Vial A')},{m:VI(0xaa0010)});
B(1,1.3,.8,3.6,.65,z1-3,0xcfd8dc,'Refrigerated sample drawer',()=>S.f?toast('Empty.'):vv('f','Vial B'));
B(.5,.6,.5,-4.2,.3,z1+3,0x2a2a2a,'Biohazard bin',()=>S.n?toast('Just waste.'):vv('n','Vial C'));
const an=()=>{if((S.v||0)<3)return toast(`Analyzer needs 3 vials (${S.v||0}/3)`);S.an=1;modal('<h3>🧪 ANALYZER RESULTS</h3><table><tr><th>Vial</th><th>Test</th><th>Result</th></tr><tr><td>A</td><td>Potassium</td><td class=hi>6.8 mmol/L ▲</td></tr><tr><td>B</td><td>Glucose</td><td class=hi>312 mg/dL ▲</td></tr><tr><td>C</td><td>Creatinine</td><td class=hi>4.5 mg/dL ▲</td></tr><tr><td>-</td><td>Sodium</td><td>140 mmol/L ✓</td></tr></table>')};
B(1.4,1.1,.8,0,.55,z1-4,0x37474f,'Blood analyzer',an);B(.8,.4,.05,0,1.25,z1-3.58,0,'Blood analyzer',an,{m:GL(0xff3030)});
B(.05,.4,.4,4.82,2,z1,0xf5e663,'Sticky note',()=>modal('<h3>📝 Note</h3><p>SAFE PIN = first digit of each flagged result (A, B, C) + the number of flagged results.</p>'));
B(.5,.8,.8,4.7,1.2,z1+1.2,0x20282c,'Wall safe',()=>S.k?toast('The safe is empty.'):keypad('WALL SAFE','4-digit PIN','6343',()=>{S.k=1;add('Sector Key')}));
// ---------- Stage 3: Microbiology ----------
const z2=-20;
B(.9,.4,.6,3.3,.2,z2+2,0xb71c1c,'Medical kit box',()=>{if(S.kit)return toast('The kit is empty.');S.kit=1;add('Glass Slide');add('Pharmacy Key');modal('<h3>MEDICAL KIT</h3><p>Under the tray: a glass slide labeled <b>S-17</b> and a small brass key.</p>')});
B(2,.9,1,-3,.45,z2-2,0x6b7b82);
B(.35,.6,.35,-3,1.2,z2-2,0x151515,'Microscope',()=>{if(!has('Glass Slide'))return toast('The microscope needs a slide.');modal('<h3>🔬 SLIDE S-17 · Gram stain 1000×</h3><canvas id=mc width=280 height=280></canvas><p>Note the cell shape, arrangement and stain colour.</p>');const c=$('#mc').getContext('2d');c.fillStyle='#e8d8e8';c.fillRect(0,0,280,280);for(let g=0;g<5;g++){const X=50+Math.random()*180,Y=50+Math.random()*180;for(let i=0;i<16;i++){c.fillStyle='#5b2a86';c.beginPath();c.arc(X+(Math.random()-.5)*50,Y+(Math.random()-.5)*50,8,0,7);c.fill()}}});
B(1.8,.9,.8,0,.45,z2-4.2,0x3b4a50);
B(1,.6,.04,0,1.3,z2-4.5,0,'Pathogen database',()=>modal('<h3>🖥 PATHOGEN DATABASE</h3><table><tr><th>Code</th><th>Morphology</th></tr><tr><td>STAPH</td><td>Gram-positive cocci, grape-like clusters</td></tr><tr><td>STREP</td><td>Gram-positive cocci, chains</td></tr><tr><td>ECOLI</td><td>Gram-negative rods</td></tr><tr><td>SPIRO</td><td>Gram-negative spirals</td></tr></table>'),{m:GL(0x2ecc71)});
// ---------- Stage 4: Pharmacy ----------
const z3=-30;
B(1.2,2,.6,-4,1,z3+1,0x607d8b,'Locked cabinet',()=>{if(!S.cb){if(!has('Pharmacy Key'))return toast('Locked. It needs a key.');rem('Pharmacy Key');S.cb=1}modal('<h3>📄 Folded note</h3><p><b>Dose (mg) = weight (kg) × 15 mg/kg ÷ 2</b><br>Two equal doses per day. Give ONE dose. Use the current weight.</p>')});
B(1.8,.9,.8,0,.45,z3-4.2,0x3b4a50);
B(1,.6,.04,0,1.3,z3-4.5,0,'Central terminal',()=>modal(`<h3>🖥 CENTRAL TERMINAL</h3><p>Patient: <b>Nasser, Layla</b> · MRN 58731<br>Admission weight: 68 kg <small>(outdated)</small><br><b>Current weight: 72 kg</b> (updated today)<br>Drug: Antidote Z-7</p><b>Calculator</b><br><input id=cv placeholder="e.g. 10*2" onkeydown="if(event.key=='Enter')cc()"><button onclick=cc()>=</button> <span id=cr></span>`),{m:GL(0x35e0c0)});
function cc(){const e=$('#cv').value;let r='ERR';if(/^[\d\s+\-*\/().]+$/.test(e))try{r='= '+Function('return '+e)()}catch(x){}$('#cr').textContent=r}
// ---------- Hint / End ----------
function hint(){if(mode=='start'||mode=='end')return;T-=180;hints++;let h;
 if(!open[0])h=!S.b?'Search the reception drawers for a badge.':'Read the laptop email, then search the patient logs for the surname Nasser.';
 else if(!open[1])h=(S.v||0)<3?'Vials: under the bench, in the cold drawer, in the biohazard bin.':!S.an?'Use the blood analyzer with all 3 vials.':'Read the sticky note beside the safe, then build the PIN from the flagged results.';
 else if(!open[2])h=!S.kit?'Open the red medical kit box.':'Examine the slide in the microscope, then match it in the database. 5 letters.';
 else h=!S.cb?'The brass key from the medical kit opens the cabinet.':'Use the current weight in the folded-note formula on the terminal calculator.';
 ui();beep(300,.2);modal(`<h3>💡 Hint (−3:00)</h3><p>${h}</p>`)}
function end(w){mode='end';document.exitPointerLock();const left=Math.max(0,Math.round(T)),d=open.filter(x=>x).length,f=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),r=!w?'DNF — Contained':left>=2400?'S — Grand Champion':left>=1500?'A — Elite Team':left>=600?'B — Solid Escape':'C — Narrow Escape';
 let L=[];try{L=JSON.parse(localStorage.mer||'[]');if(w)L.push({c:club,r:left,h:hints});L.sort((a,b)=>b.r-a.r);L=L.slice(0,5);localStorage.mer=JSON.stringify(L)}catch(e){}
 $('#m').style.display='none';$('#end').innerHTML=`<div class=box><h1>${w?'🏆 ESCAPED':'☣ TIME EXPIRED'}</h1><h2>${club}</h2><table><tr><td>Time remaining</td><td>${f(left)}</td></tr><tr><td>Puzzles completed</td><td>${d} / 4</td></tr><tr><td>Hints used</td><td>${hints} (−${hints*3} min)</td></tr><tr><td>Rank</td><td class=hi>${r}</td></tr></table><h3>Leaderboard (this device)</h3>${L.map((x,i)=>`<div>${i+1}. ${x.c} — ${f(x.r)} (hints ${x.h})</div>`).join('')||'—'}<p><button onclick=location.reload()>Play again</button></p></div>`;$('#end').style.display='flex';$('#hud').style.display='none'}
// ---------- Audio ----------
function beep(f=880,d=.12,v=.05){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function audio(){try{AC=new(window.AudioContext||webkitAudioContext)();[48,50.5].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=.025;o.connect(g).connect(AC.destination);o.start()});setInterval(()=>{if(mode=='play'||mode=='ui'){beep(740,.35,.04);setTimeout(()=>beep(560,.35,.04),380)}},7000)}catch(e){}}
// ---------- Controls ----------
function go(){club=esc($('#club').value.trim()||'Team Alpha');$('#start').style.display='none';$('#hud').style.display='block';mode='play';ui();audio();try{R.domElement.requestPointerLock()}catch(e){}toast('The lab is sealed. Find the codes. 60:00 and counting...')}
const lk=()=>document.pointerLockElement===R.domElement;let drag=0;
addEventListener('keydown',e=>{if(e.code=='Escape'&&mode=='ui'){closeM();return}if(mode!='play')return;k[e.code]=1;if(e.code=='KeyE')interact();if(e.code=='KeyF')on^=1;if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>k[e.code]=0);
addEventListener('mousemove',e=>{if(mode=='play'&&(lk()||drag)){yaw-=e.movementX*.0023;pit=Math.max(-1.4,Math.min(1.4,pit-e.movementY*.0023))}});
R.domElement.addEventListener('mousedown',()=>{drag=1;if(mode=='play'){if(!lk())try{R.domElement.requestPointerLock()}catch(e){}interact()}});
addEventListener('mouseup',()=>drag=0);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
function interact(){if(mode!='play'||!cur)return;beep(520,.05,.04);cur.userData.f(cur)}
const rc=new THREE.Raycaster();
function pick(){cur=null;if(mode=='play'){rc.setFromCamera({x:0,y:0},cam);const h=rc.intersectObjects(ia.filter(m=>m.visible))[0];if(h&&h.distance<3.6)cur=h.object}$('#pr').textContent=cur?'[E] '+cur.userData.n:''}
function mv(dt){const a=(k.ArrowLeft?1:0)-(k.ArrowRight?1:0),b=(k.ArrowUp?1:0)-(k.ArrowDown?1:0);yaw+=a*1.8*dt;pit=Math.max(-1.4,Math.min(1.4,pit+b*1.5*dt));
 const f=(k.KeyW?1:0)-(k.KeyS?1:0),s=(k.KeyD?1:0)-(k.KeyA?1:0),sp=(k.ShiftLeft?4.5:2.8)*dt,p=cam.position,ox=p.x,oz=p.z;
 let nx=ox+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,nz=oz+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
 nx=Math.max(-4.6,Math.min(4.6,nx));nz=Math.max(-34.6,Math.min(4.6,nz));
 const ok=(x,z)=>{for(let i=0;i<4;i++)if(Math.abs(z-WZ[i])<.45&&!(open[i]&&Math.abs(x)<.8))return 0;return sol.every(q=>!q.m.visible||x<q.b[0]-.3||x>q.b[1]+.3||z<q.b[2]-.3||z>q.b[3]+.3)};
 if(ok(nx,nz)){p.x=nx;p.z=nz}else if(ok(nx,oz))p.x=nx;else if(ok(ox,nz))p.z=nz}
let last=performance.now(),tt=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.1);last=now;tt+=dt;
 if(mode=='play'||mode=='ui'){T-=dt;if(T<=0){T=0;end(false)}const s=Math.ceil(T);$('#tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('#tm').style.opacity=T<300&&Math.floor(tt*2)%2?.4:1}
 if(mode=='play')mv(dt);
 lights.forEach((l,i)=>l.intensity=i%2?(Math.random()<.03?0:.5):1+.9*Math.sin(tt*3+i));
 fl.intensity=on?2.4*(Math.random()<.02?.5:1):0;
 cam.rotation.set(pit,yaw,0);pick();R.render(sc,cam)}
requestAnimationFrame(loop);
</script></body></html>
